services:
    agenceweb.mercanet_bnp_paribas.form.type.gateway_configuration:
        class: Agenceweb\MercanetBnpParibasPlugin\Form\Type\MercanetBnpParibasGatewayConfigurationType
        public: true
        tags:
            - { name: "sylius.gateway_configuration_type", type: "mercanet_bnp_paribas", label: "mercanet_bnp_paribas.gateway_label" }
            - { name: "form.type" }

    agenceweb.mercanet_bnp_paribas.gateway_factory:
        class: Payum\Core\Bridge\Symfony\Builder\GatewayFactoryBuilder
        public: true
        arguments:
            - 'Agenceweb\MercanetBnpParibasPlugin\MercanetBnpParibasGatewayFactory'
        tags:
            - { name: "payum.gateway_factory_builder", factory: "mercanet_bnp_paribas" }

    agenceweb.mercanet_bnp_paribas.action.capture:
        class: Agenceweb\MercanetBnpParibasPlugin\Action\CaptureAction
        public: true
        arguments:
            - "@payum"
        tags:
            - { name: "payum.action", factory: "mercanet_bnp_paribas", alias: "payum.action.capture" }

    agenceweb.mercanet_bnp_paribas.action.notify:
        class: Agenceweb\MercanetBnpParibasPlugin\Action\NotifyAction
        public: true
        arguments:
            - "@sylius_abstraction.state_machine"
        tags:
            - { name: "payum.action", factory: "mercanet_bnp_paribas", alias: "payum.action.notify" }

    agenceweb.mercanet_bnp_paribas.action.status:
        class: Agenceweb\MercanetBnpParibasPlugin\Action\StatusAction
        public: true
        arguments:
            - "@request_stack"
        tags:
            - { name: "payum.action", factory: "mercanet_bnp_paribas", alias: "payum.action.status" }

    agenceweb.mercanet_bnp_paribas.bridge.mercanet_bnp_paribas_bridge:
        class: Agenceweb\MercanetBnpParibasPlugin\Bridge\MercanetBnpParibasBridge
        public: true
        arguments:
            - "@request_stack"
